name: LoginCoreX
description: Player authentication and protection system for Paper, Purpur, Folia and Velocity.
prefix: LoginCoreX
version: '${version}'

main: pl.syntaxdevteam.logincorex.paper.LoginCoreXPaper
bootstrapper: pl.syntaxdevteam.logincorex.paper.bootstrap.LoginCoreXBootstrap
loader: pl.syntaxdevteam.logincorex.paper.loader.SyntaxLoader
api-version: '26.1'
load: STARTUP
has-open-classloader: false

dependencies:
  server:
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true

authors: [ SyntaxDevTeam ]
website: https://syntaxdevteam.pl

permissions:
  logincorex.auth.skip-password:
    description: Allows a Mojang-verified account to skip the additional server password.
    default: false
  logincorex.command.privacy:
    description: Allows showing, accepting, rejecting, and revoking the privacy policy after login.
    default: true
  logincorex.command.changepassword:
    description: Allows authenticated players to change their password.
    default: true
  logincorex.command.logout:
    description: Allows authenticated players to invalidate their session.
    default: true
  logincorex.admin.password:
    description: Allows setting an account password through a secure dialog.
    default: op
  logincorex.admin.reload:
    description: Allows reloading configuration settings explicitly supported at runtime.
    default: op
  logincorex.admin.info:
    description: Allows opening the administrative account inspection report.
    default: op
  logincorex.admin.alts:
    description: Allows reviewing suspected account links by shared address history.
    default: op
  logincorex.admin.migration.view:
    description: Allows inspecting premium migration tickets and provider diagnostics.
    default: op
  logincorex.admin.migration.execute:
    description: Allows retrying an existing premium migration ticket.
    default: op
  logincorex.admin.migration.recover:
    description: Allows creating evidence-gated recovery migrations for accounts affected by older LoginCoreX versions.
    default: op
  logincorex.admin.view-security:
    description: Reveals lock state, failed-login counters and recent security audit events in account reports.
    default: op
  logincorex.admin.alerts:
    description: Receives advisory multi-account and VPN alerts after authentication.
    default: op
  logincorex.admin.view-ip:
    description: Reveals source IP addresses inside LoginCoreX administrative alerts.
    default: op
  logincorex.admin.view-geo:
    description: Reveals GeoIP, ASN, provider and network operator metadata inside administrative alerts.
    default: op
