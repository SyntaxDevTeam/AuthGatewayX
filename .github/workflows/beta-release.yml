name: Package and publish beta distributions

on:
  push:
    tags:
      - 'v*-beta.*'

permissions:
  contents: read

jobs:
  package:
    name: Build ${{ matrix.id }}
    runs-on: [self-hosted, linux, x64, syntaxdev-ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: paper-26.1.2
            platform: paper
            bundle: '26.1.2.build.74-stable'
            minecraft: '26.1.2'
          - id: paper-26.2
            platform: paper
            bundle: '26.2.build.133-stable'
            minecraft: '26.2'
          - id: paper-26.3
            platform: paper
            bundle: '26.3.build.241-stable'
            minecraft: '26.3'
          - id: velocity-4
            platform: velocity
            bundle: ''
            minecraft: ''

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble version-specific binary
        env:
          PLATFORM: ${{ matrix.platform }}
          PAPER_BUNDLE: ${{ matrix.bundle }}
          MC_VERSION: ${{ matrix.minecraft }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          if [[ "$PLATFORM" == "paper" ]]; then
            ./gradlew :authgatewayx-paper:shadowJar \
              -PreleaseVersion="$RELEASE_VERSION" \
              -PpaperDevBundleVersion="$PAPER_BUNDLE" \
              --console=plain --no-daemon
            cp "authgatewayx-paper/build/libs/AuthGatewayX-Paper-$RELEASE_VERSION.jar" \
              "dist/AuthGatewayX-Paper-$RELEASE_VERSION-MC$MC_VERSION.jar"
          else
            ./gradlew :authgatewayx-velocity:shadowJar \
              -PreleaseVersion="$RELEASE_VERSION" \
              --console=plain --no-daemon
            cp "authgatewayx-velocity/build/libs/AuthGatewayX-Velocity-$RELEASE_VERSION.jar" \
              "dist/AuthGatewayX-Velocity-$RELEASE_VERSION-Velocity4.jar"
          fi
          sha256sum dist/*.jar > "dist/sha256-${PLATFORM}-${MC_VERSION:-4}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: beta-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish tagged prerelease
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: beta-*
          path: dist
          merge-multiple: true
      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.jar dist/sha256-*.txt)
          if (( ${#files[@]} != 8 )); then
            echo "Expected exactly four JARs and four checksums; got ${#files[@]}"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --prerelease --verify-tag --generate-notes \
              --title "AuthGatewayX ${GITHUB_REF_NAME#v} (beta)"
          fi

# Never tag until the pre-world auth, premium migration, NMS and proxy gates
# in docs/16-prejoin-authentication-and-26x-compatibility.md are approved.
# Version-specific Paper builds avoid assuming 26.3 NMS binaries run on 26.1.
