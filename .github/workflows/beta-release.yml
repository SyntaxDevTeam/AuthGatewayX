name: Package and publish beta distributions

on:
  push:
    branches:
      - 'beta/v*-beta.*'

permissions:
  contents: read

jobs:
  package:
    name: Build ${{ matrix.id }}
    runs-on: [self-hosted, linux, x64, syntaxdev-ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: paper-26.1.2
            platform: paper
            bundle: '26.1.2.build.74-stable'
            minecraft: '26.1.2'
          - id: paper-26.2
            platform: paper
            bundle: '26.2.build.133-stable'
            minecraft: '26.2'
          - id: paper-26.3
            platform: paper
            bundle: '26.3.build.241-stable'
            minecraft: '26.3'
          - id: velocity-4
            platform: velocity
            bundle: ''
            minecraft: ''

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble version-specific binary
        env:
          PLATFORM: ${{ matrix.platform }}
          PAPER_BUNDLE: ${{ matrix.bundle }}
          MC_VERSION: ${{ matrix.minecraft }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          RELEASE_VERSION="${GITHUB_REF_NAME#beta/v}"
          mkdir -p dist
          if [[ "$PLATFORM" == "paper" ]]; then
            ./gradlew :authgatewayx-paper:shadowJar \
              -PreleaseVersion="$RELEASE_VERSION" \
              -PpaperDevBundleVersion="$PAPER_BUNDLE" \
              --console=plain --no-daemon
            cp "authgatewayx-paper/build/libs/AuthGatewayX-Paper-$RELEASE_VERSION.jar" \
              "dist/AuthGatewayX-Paper-$RELEASE_VERSION-MC$MC_VERSION.jar"
          else
            ./gradlew :authgatewayx-velocity:shadowJar \
              -PreleaseVersion="$RELEASE_VERSION" \
              --console=plain --no-daemon
            cp "authgatewayx-velocity/build/libs/AuthGatewayX-Velocity-$RELEASE_VERSION.jar" \
              "dist/AuthGatewayX-Velocity-$RELEASE_VERSION-Velocity4.jar"
          fi
          (cd dist && sha256sum ./*.jar > "sha256-${PLATFORM}-${MC_VERSION:-4}.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: beta-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish tagged prerelease
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: beta-*
          path: dist
          merge-multiple: true
      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.jar dist/sha256-*.txt)
          if (( ${#files[@]} != 8 )); then
            echo "Expected exactly four JARs and four checksums; got ${#files[@]}"
            exit 1
          fi
          TAG="v${GITHUB_REF_NAME#beta/v}"
          # 'gh release create --target' creates a missing tag at the exact
          # verified commit. It avoids ambiguous Git ref lookup responses.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --prerelease --target "$GITHUB_SHA" --generate-notes \
              --title "AuthGatewayX ${TAG#v} (beta)"
          fi

# The beta/v*-beta.* branch is created only from a verified PR head.
# The workflow creates its release tag AFTER all four candidate JARs build.
# Do not create a beta branch until code/CI review is complete.
# Version-specific Paper builds avoid assuming 26.3 NMS binaries run on 26.1.
