name: Build and publish plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: authgatewayx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MINI_PORTAL_URL: https://syntaxdevteam.pl
  BUILD_SLUG: authgatewayx

jobs:
  verify:
    name: Verify repository
    runs-on: [self-hosted, linux, x64, syntaxdev-ci]
    services:
      mysql:
        image: mysql:26.10
        env:
          MYSQL_DATABASE: authgatewayx_test
          MYSQL_USER: authgatewayx
          MYSQL_PASSWORD: authgatewayx
          MYSQL_ROOT_PASSWORD: root
        ports:
          # Bind IPv4 only: Docker may assign different ports for IPv4 and IPv6.
          - "127.0.0.1::3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mariadb:
        image: mariadb:13.0
        env:
          MARIADB_DATABASE: authgatewayx_test
          MARIADB_USER: authgatewayx
          MARIADB_PASSWORD: authgatewayx
          MARIADB_ROOT_PASSWORD: root
        ports:
          # Bind IPv4 only: Docker may assign different ports for IPv4 and IPv6.
          - "127.0.0.1::3306"
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: authgatewayx_test
          POSTGRES_USER: authgatewayx
          POSTGRES_PASSWORD: authgatewayx
        ports:
          - "127.0.0.1::5432"
        options: >-
          --health-cmd="pg_isready -U authgatewayx -d authgatewayx_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Isolate Gradle user home
        shell: bash
        run: echo "GRADLE_USER_HOME=${RUNNER_TEMP}/authgatewayx-gradle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify required CI inputs are tracked
        run: |
          git ls-files --error-unmatch \
            tools/benchmark_local_login.py \
            tools/test_benchmark_local_login.py \
            authgatewayx-paper/src/main/kotlin/pl/syntaxdevteam/authgatewayx/paper/premium/PremiumSessionVerification.kt \
            authgatewayx-paper/src/main/kotlin/pl/syntaxdevteam/authgatewayx/paper/privacy/ConsentPolicyLink.kt \
            authgatewayx-paper/src/test/kotlin/pl/syntaxdevteam/authgatewayx/paper/premium/PremiumSessionVerificationTest.kt \
            authgatewayx-paper/src/test/kotlin/pl/syntaxdevteam/authgatewayx/paper/privacy/ConsentPolicyLinkTest.kt > /dev/null

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify database connectivity from runner
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          MARIADB_PORT: ${{ job.services.mariadb.ports[3306] }}
          POSTGRESQL_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          python3 - <<'PYTHON'
          import os
          import socket
          import time

          deadline = time.monotonic() + 30
          pending = {
              name: int(os.environ[f"{name}_PORT"])
              for name in ("MYSQL", "MARIADB", "POSTGRESQL")
          }
          while pending:
              for name, port in list(pending.items()):
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=1):
                          pass
                  except OSError:
                      continue
                  print(f"{name}: IPv4 port {port} is reachable")
                  del pending[name]
              if pending:
                  if time.monotonic() >= deadline:
                      raise SystemExit(f"Database ports unreachable from runner: {pending}")
                  time.sleep(1)
          PYTHON

      - name: Test and build distributable JARs
        env:
          AGX_REQUIRE_REMOTE_DATABASES: "true"
          AGX_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports[3306] }}/authgatewayx_test?useSSL=false&allowPublicKeyRetrieval=true
          AGX_TEST_MYSQL_USER: authgatewayx
          AGX_TEST_MYSQL_PASSWORD: authgatewayx
          AGX_TEST_MARIADB_URL: jdbc:mariadb://127.0.0.1:${{ job.services.mariadb.ports[3306] }}/authgatewayx_test
          AGX_TEST_MARIADB_USER: authgatewayx
          AGX_TEST_MARIADB_PASSWORD: authgatewayx
          AGX_TEST_POSTGRESQL_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports[5432] }}/authgatewayx_test
          AGX_TEST_POSTGRESQL_USER: authgatewayx
          AGX_TEST_POSTGRESQL_PASSWORD: authgatewayx
        run: |
          chmod +x ./gradlew
          ./gradlew clean buildAll --console=plain --no-daemon

      - name: Verify bounded local protocol harness
        run: |
          python3 - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover("tools", pattern="test_*.py")
          if suite.countTestCases() == 0:
              raise SystemExit("No local protocol harness tests discovered")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Measure bounded in-process security workloads
        run: |
          ./gradlew :authgatewayx-security:securityBenchmark --console=plain --no-daemon
          cat authgatewayx-security/build/reports/benchmarks/security.json

      - name: Verify Paper distributable JAR
        run: |
          jar="$(find authgatewayx-paper/build/libs -maxdepth 1 -name 'AuthGatewayX-Paper-*.jar' ! -name '*-plain.jar' | head -n 1)"
          test -n "${jar}"
          unzip -p "${jar}" paper-plugin.yml > paper-plugin-check.yml
          grep -q '^loader: pl.syntaxdevteam.authgatewayx.paper.loader.SyntaxLoader$' paper-plugin-check.yml
          unzip -Z1 "${jar}" > paper-jar-entries.txt
          grep -Fxq 'pl/syntaxdevteam/authgatewayx/storage/jdbc/JdbcAccountStorage.class' paper-jar-entries.txt

      - name: Verify Velocity distributable JAR
        run: |
          python3 tools/verify_velocity_distribution.py authgatewayx-velocity/build/libs

  publish:
    name: Publish ${{ matrix.name }}
    runs-on: [self-hosted, linux, x64, syntaxdev-ci]
    needs: verify
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Paper
            platform: paper
            platform_family: server
            gradle_task: :authgatewayx-paper:build
            properties_task: :authgatewayx-paper:properties
            jar_dir: authgatewayx-paper/build/libs
            artifact_prefix: AuthGatewayX-
            compatible_platforms: paper,purpur,folia
          - name: Velocity
            platform: velocity
            platform_family: proxy
            gradle_task: :authgatewayx-velocity:build
            properties_task: :authgatewayx-velocity:properties
            jar_dir: authgatewayx-velocity/build/libs
            artifact_prefix: authgatewayx-velocity-
            compatible_platforms: velocity
    env:
      BUILD_PLATFORM: ${{ matrix.platform }}
      BUILD_PLATFORM_FAMILY: ${{ matrix.platform_family }}
      BUILD_GRADLE_TASK: ${{ matrix.gradle_task }}
      BUILD_GRADLE_PROPERTIES_TASK: ${{ matrix.properties_task }}
      BUILD_JAR_DIR: ${{ matrix.jar_dir }}
      BUILD_ARTIFACT_PREFIX: ${{ matrix.artifact_prefix }}
      BUILD_COMPATIBLE_PLATFORMS: ${{ matrix.compatible_platforms }}

    steps:
      - name: Isolate Gradle user home
        shell: bash
        run: echo "GRADLE_USER_HOME=${RUNNER_TEMP}/authgatewayx-gradle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build ${{ matrix.name }} plugin
        run: |
          chmod +x ./gradlew
          ./gradlew "${BUILD_GRADLE_TASK}" --console=plain --no-daemon

      - name: Publish ${{ matrix.name }} artifact to BuildExplorer v2
        env:
          BUILD_CI_TOKEN: ${{ secrets.BUILD_CI_TOKEN }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_AFTER: ${{ github.sha }}
          GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_NUMBER_VALUE: ${{ github.run_number }}
        run: |
          set -euo pipefail

          if [ -z "${BUILD_CI_TOKEN}" ]; then
            echo "Missing BUILD_CI_TOKEN repository secret." >&2
            exit 1
          fi

          if [ ! -d "${BUILD_JAR_DIR}" ]; then
            echo "Directory ${BUILD_JAR_DIR} does not exist for ${BUILD_SLUG}/${BUILD_PLATFORM}." >&2
            exit 1
          fi

          jar="$(python3 - <<'PY'
          from pathlib import Path
          import os
          import sys

          jar_dir = Path(os.environ["BUILD_JAR_DIR"])
          prefix = os.environ["BUILD_ARTIFACT_PREFIX"]
          excluded_suffixes = ("-sources.jar", "-javadoc.jar", "-plain.jar", "-original.jar")
          candidates = [
              path for path in jar_dir.glob("*.jar")
              if not path.name.endswith(excluded_suffixes)
          ]
          preferred = [path for path in candidates if path.name.startswith(prefix)]
          pool = preferred or candidates
          if not pool:
              sys.exit(1)
          print(max(pool, key=lambda path: path.stat().st_size))
          PY
          )"
          if [ -z "${jar}" ]; then
            echo "No JAR found for ${BUILD_SLUG}/${BUILD_PLATFORM} in ${BUILD_JAR_DIR}." >&2
            exit 1
          fi

          version="$(./gradlew -q "${BUILD_GRADLE_PROPERTIES_TASK}" --console=plain --no-daemon | awk -F': ' '$1 == "version" {print $2; exit}' | tr -d '\r')"
          if [ -z "${version}" ] || [ "${version}" = "unspecified" ]; then
            echo "Missing Gradle project version; cannot determine release channel." >&2
            exit 1
          fi

          BUILD_CHANNEL="$(python3 tools/build_channel.py "${version}")"
          export BUILD_CHANNEL
          echo "Publishing version ${version} to channel ${BUILD_CHANNEL}"

          artifact_base="$(basename "${jar}" .jar)"
          if [ "${artifact_base%-${GITHUB_RUN_NUMBER_VALUE}}" != "${artifact_base}" ]; then
            filename="${artifact_base}.jar"
          else
            filename="${artifact_base}-${GITHUB_RUN_NUMBER_VALUE}.jar"
          fi
          sha256="$(sha256sum "${jar}" | awk '{print $1}')"
          size="$(stat -c%s "${jar}")"
          max_build_explorer_size=$((45 * 1024 * 1024))

          echo "Selected artifact: ${jar} (${size} bytes)"
          if [ "${size}" -le 0 ]; then
            echo "Selected JAR is empty." >&2
            exit 1
          fi
          if [ "${size}" -gt "${max_build_explorer_size}" ]; then
            echo "Selected JAR exceeds Build Explorer's 45 MiB application limit." >&2
            exit 1
          fi
          if ! unzip -tqq "${jar}"; then
            echo "Selected JAR is not a valid ZIP/JAR archive." >&2
            exit 1
          fi

          export BUILD_VERSION="${version}"
          export BUILD_FILENAME="${filename}"
          export BUILD_SHA256="${sha256}"
          export BUILD_SIZE="${size}"

          python3 - <<'PY' > build-info.json
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          before = os.environ.get("GITHUB_BEFORE", "")
          after = os.environ["GITHUB_AFTER"]
          rev_range = after
          if before and before != "0000000000000000000000000000000000000000":
              rev_range = f"{before}..{after}"

          raw = subprocess.check_output(
              ["git", "log", "--format=%H%x1f%cI%x1f%s", rev_range],
              text=True,
          ).strip()
          commits = []
          for line in raw.splitlines():
              if not line:
                  continue
              sha, time, message = line.split("\x1f", 2)
              commits.append({"sha": sha, "time": time, "message": message})

          compatible_platforms = [
              item.strip().lower()
              for item in os.environ.get("BUILD_COMPATIBLE_PLATFORMS", "").split(",")
              if item.strip()
          ]

          payload = {
              "id": int(os.environ["GITHUB_RUN_ID_VALUE"]),
              "time": datetime.now(timezone.utc).isoformat(),
              "channel": os.environ["BUILD_CHANNEL"],
              "platform": os.environ["BUILD_PLATFORM"],
              "platform_family": os.environ["BUILD_PLATFORM_FAMILY"],
              "compatible_platforms": compatible_platforms,
              "version": os.environ["BUILD_VERSION"],
              "build_number": os.environ["GITHUB_RUN_NUMBER_VALUE"],
              "filename": os.environ["BUILD_FILENAME"],
              "sha256": os.environ["BUILD_SHA256"],
              "size": int(os.environ["BUILD_SIZE"]),
              "java_version": 25,
              "branch": os.environ.get("GITHUB_REF_NAME_VALUE", ""),
              "commit_sha": after,
              "commits": commits[:100],
          }
          print(json.dumps(payload, ensure_ascii=False))
          PY

          curl --fail-with-body \
            -X POST "${MINI_PORTAL_URL}/api/v2/builds/ci/${BUILD_SLUG}" \
            -H "X-Build-Token: ${BUILD_CI_TOKEN}" \
            -F "metadata=<build-info.json;type=application/json" \
            -F "artifact=@${jar};filename=${filename};type=application/java-archive"
