name: Publish public API to Nexus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, syntaxdev-ci]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify and publish contracts
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: bash ./gradlew check verifyDistributions publishApiToNexus --console=plain --no-daemon
