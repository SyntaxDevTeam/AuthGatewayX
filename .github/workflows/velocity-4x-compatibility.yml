name: Velocity 4.x source compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'authgatewayx-velocity/**'
      - 'authgatewayx-domain/**'
      - 'authgatewayx-integrations/**'
      - 'authgatewayx-security/**'
      - 'authgatewayx-storage-*/**'
      - 'authgatewayx-api/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/velocity-4x-compatibility.yml'
  workflow_dispatch:

concurrency:
  group: authgatewayx-velocity-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-velocity:
    name: Velocity ${{ matrix.api }}
    runs-on: [self-hosted, linux, x64, syntaxdev-ci]
    strategy:
      fail-fast: false
      matrix:
        api: ['4.0.0', '4.1.1', '4.2.0', '4.3.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile against Velocity ${{ matrix.api }}
        run: |
          chmod +x ./gradlew
          ./gradlew :authgatewayx-velocity:compileKotlin \
            -PvelocityApiVersion='${{ matrix.api }}' \
            --console=plain --no-daemon


  candidate-velocity:
    name: Velocity 4.x candidate binary
    needs: compile-velocity
    runs-on: [self-hosted, linux, x64, syntaxdev-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Velocity snapshot candidate
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew stageVelocityCandidate --console=plain --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: authgatewayx-snapshot-velocity-4
          path: build/compatibility/velocity/*.jar
          if-no-files-found: error
          retention-days: 30

# Compatibility matrix checks compilation, not linking of SyntaxCore/MessageHandler at runtime.
# Real Velocity 4.0/4.1/4.2/4.3 functional tests are required before beta.
