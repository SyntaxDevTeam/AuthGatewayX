prefix: "<gradient:#55ffff:#5555ff>[<b>AuthGatewayX</b>]</gradient>"
auth:
  unavailable: "<red>Usługa uwierzytelniania nie jest gotowa. Spróbuj ponownie później.</red>"
  rate_limited: "<red>Zbyt wiele prób połączenia. Spróbuj ponownie później.</red>"
  invalid_username: "<red>Nieprawidłowa nazwa gracza.</red>"
  mojang_unavailable: "<red>Nie można bezpiecznie sprawdzić statusu konta Mojang.</red>"
  state_mismatch: "<red>Stan uwierzytelnienia połączenia jest nieprawidłowy.</red>"
  vpn_denied: "<red>Polityka bezpieczeństwa proxy nie zezwala na to połączenie sieciowe. Wyłącz VPN/proxy lub skontaktuj się z administracją.</red>"
  multi_denied: "<red>Połączenie nie spełnia polityki kont tego serwera. Skontaktuj się z administracją.</red>"

risk:
  usage: "<yellow>/authgatewayx alts {argument}</yellow>"
  unavailable: "<red>Raport jest niedostępny, wyłączony lub trwa inne zapytanie.</red>"
  not_found: "<gray>Nie znaleziono konta offline o tej nazwie.</gray>"
  header: "<gold>Powiązania konta {username} z ostatnich 30 dni — poszlaki wspólnego IP.</gold>"
  entry: "<yellow>{username}</yellow><gray>: wspólne adresy {count}</gray>"
  empty: "<gray>Brak powiązań w dostępnej historii. Nie wyklucza to multi-konta.</gray>"
  truncated: "<yellow>Pokazano pierwsze 20 wyników.</yellow>"
  announcement_header: "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray><newline><gold><b>OFICJALNY KOMUNIKAT</b></gold> <dark_gray>•</dark_gray> <yellow>AuthGatewayX</yellow>"
  denied_alert: "<red><b>POŁĄCZENIE ODRZUCONE</b></red><newline><dark_gray>│</dark_gray> <gray>Gracz:</gray> <white>{username}</white>"
  connection_alert: "<yellow><b>POŁĄCZENIE WYMAGA WERYFIKACJI</b></yellow><newline><dark_gray>│</dark_gray> <gray>Gracz:</gray> <white>{username}</white>"
  ip_alert: "<dark_gray>│</dark_gray> <gray>Adres IP:</gray> <white>{ip}</white>"
  account_alert: "<dark_gray>│</dark_gray> <gray>Powiązane konta ({count}):</gray><newline><dark_gray>│</dark_gray> <yellow>{accounts}</yellow>"
  network_alert: "<dark_gray>│</dark_gray> <gray>Sygnały sieciowe:</gray> <yellow>{signals}</yellow><newline><dark_gray>│</dark_gray> <gray>Pewność:</gray> <white>{confidence}</white> <dark_gray>•</dark_gray> <gray>Ryzyko:</gray> <white>{risk}</white>"
  geo_alert: "<dark_gray>│</dark_gray> <gray>GeoIP:</gray> <white>{city}, {region}, {country} ({country_code})</white><newline><dark_gray>│</dark_gray> <gray>Kontynent / strefa:</gray> <white>{continent} • {timezone}</white>"
  network_owner_alert: "<dark_gray>│</dark_gray> <gray>Sieć:</gray> <white>{asn}</white> <dark_gray>•</dark_gray> <white>{network_type}</white><newline><dark_gray>│</dark_gray> <gray>Właściciel:</gray> <white>{owner}</white>"
  operator_alert: "<dark_gray>│</dark_gray> <gray>Operator anonimizujący:</gray> <yellow>{operator}</yellow>"
  advisory: "<newline><gold><b>DALSZE DZIAŁANIE</b></gold><newline><gray>Traktuj sygnały jako poszlaki, nie dowód jednej osoby.</gray><newline><gray>Sprawdź:</gray> <yellow>/authgatewayx alts {username}</yellow>"
  lookup_unavailable: "<newline><gold><b>UWAGA</b></gold><newline><gray>Część kontroli jest niedostępna. Brak wyniku nie oznacza braku zagrożenia.</gray>"
  announcement_footer: "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st></dark_gray>"
  auth_required: "<red>Nie można potwierdzić aktywnej sesji. Zaloguj się; konto offline administracji wymaga zgodnego staff-proof.secret na proxy i Paper.</red>"
