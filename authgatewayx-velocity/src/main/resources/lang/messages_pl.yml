prefix: "<gradient:#55ffff:#5555ff>[<b>AuthGatewayX</b>]</gradient>"
auth:
  unavailable: "<red>Usługa uwierzytelniania nie jest gotowa. Spróbuj ponownie później.</red>"
  rate_limited: "<red>Zbyt wiele prób połączenia. Spróbuj ponownie później.</red>"
  invalid_username: "<red>Nieprawidłowa nazwa gracza.</red>"
  mojang_unavailable: "<red>Nie można bezpiecznie sprawdzić statusu konta Mojang.</red>"
  state_mismatch: "<red>Stan uwierzytelnienia połączenia jest nieprawidłowy.</red>"
  vpn_denied: "<red>Polityka bezpieczeństwa proxy nie zezwala na to połączenie sieciowe. Wyłącz VPN/proxy lub skontaktuj się z administracją.</red>"
  multi_denied: "<red>Połączenie nie spełnia polityki kont tego serwera. Skontaktuj się z administracją.</red>"

risk:
  usage: "<yellow>/authgatewayx alts &lt;nick&gt;</yellow>"
  unavailable: "<red>Raport jest niedostępny, wyłączony lub trwa inne zapytanie.</red>"
  not_found: "<gray>Nie znaleziono konta offline o tej nazwie.</gray>"
  header: "<gold>Powiązania konta {username} z ostatnich 30 dni — poszlaki wspólnego IP.</gold>"
  entry: "<yellow>{username}</yellow><gray>: wspólne adresy {count}</gray>"
  empty: "<gray>Brak powiązań w dostępnej historii. Nie wyklucza to multi-konta.</gray>"
  truncated: "<yellow>Pokazano pierwsze 20 wyników.</yellow>"
  denied_alert: "<gold>[AuthGatewayX] Proxy odrzuciło próbę połączenia pod nickiem {username}.</gold>"
  connection_alert: "<gold>[AuthGatewayX] Połączenie pod nickiem {username} — sygnały do weryfikacji przed auth offline:</gold>"
  account_alert: "<yellow>IP znane z kont: {accounts}. To nie dowodzi jednej osoby.</yellow>"
  network_alert: "<yellow>Reputacja: {signals}; kraj wyjścia: {country}; ASN: {asn}.</yellow>"
  lookup_unavailable: "<gray>Część kontroli jest niedostępna; brak wyniku nie oznacza braku zagrożenia.</gray>"
  auth_required: "<red>Nie można potwierdzić aktywnej sesji. Zaloguj się; konto offline administracji wymaga zgodnego staff-proof.secret na proxy i Paper.</red>"
  network_alert_no_geo: "<yellow>Reputacja: {signals}.</yellow>"
