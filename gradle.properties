kotlin.code.style=official
# Native access is required by libraries executing in Gradle's build JVM as well.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
