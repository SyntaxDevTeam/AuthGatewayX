name: AuthGatewayX
description: Secure mixed-mode authentication gateway for Paper, Purpur, Folia and Velocity.
prefix: AuthGatewayX
version: '${version}'

main: pl.syntaxdevteam.authgatewayx.paper.AuthGatewayXPaper
bootstrapper: pl.syntaxdevteam.authgatewayx.paper.bootstrap.AuthGatewayXBootstrap
loader: pl.syntaxdevteam.authgatewayx.paper.loader.AuthGatewayXLoader
api-version: '26.2'
load: STARTUP
has-open-classloader: false

authors: [ SyntaxDevTeam ]
website: https://syntaxdevteam.pl

permissions:
  authgatewayx.command.changepassword:
    description: Allows an authenticated offline player to change their password.
    default: true
  authgatewayx.command.logout:
    description: Allows an authenticated offline player to invalidate their session.
    default: true
  authgatewayx.admin.password:
    description: Allows setting the password of an offline account through a secure dialog.
    default: op
  authgatewayx.admin.info:
    description: Allows opening the administrative account inspection report.
    default: op
  authgatewayx.admin.alts:
    description: Allows reviewing suspected account links by shared address history.
    default: op
  authgatewayx.admin.migration.view:
    description: Allows inspecting premium migration tickets and provider diagnostics.
    default: op
  authgatewayx.admin.migration.execute:
    description: Allows retrying an existing premium migration ticket.
    default: op
  authgatewayx.admin.migration.recover:
    description: Allows creating evidence-gated recovery migrations for accounts affected by older AuthGatewayX versions.
    default: op
  authgatewayx.admin.view-security:
    description: Reveals lock state, failed-login counters and recent security audit events in account reports.
    default: op
  authgatewayx.admin.alerts:
    description: Receives advisory multi-account and VPN alerts after authentication.
    default: op
  authgatewayx.admin.view-ip:
    description: Reveals source IP addresses inside AuthGatewayX administrative alerts.
    default: op
  authgatewayx.admin.view-geo:
    description: Reveals GeoIP, ASN, provider and network operator metadata inside administrative alerts.
    default: op
