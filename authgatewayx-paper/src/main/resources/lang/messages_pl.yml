  prompt: "<yellow>Wykryto istniejące konto non-premium o tym samym nicku.</yellow><newline><gray>Stare UUID:</gray> <white>{old_uuid}</white><newline><gray>Nowe UUID premium:</gray> <white>{new_uuid}</white><newline><newline><gray>Aby potwierdzić, że oba profile należą do Ciebie, wpisz hasło używane dotychczas do konta non-premium. AuthGatewayX nie zmieni UUID konta, dopóki migracja danych nie zostanie bezpiecznie zakończona.</gray>"
  password_label: "Hasło starego konta non-premium"
  identity_conflict: "<red>Stan konta zmienił się lub docelowe UUID jest już używane. Migracja została zatrzymana.</red>"
