language: "PL"
premium:
  lookup:
    timeout-millis: 3000
    positive-ttl-seconds: 21600
    negative-ttl-seconds: 300
    maximum-cache-size: 50000
anti-bot:
  maximum-tracked-addresses: 50000
  username-burst:
    maximum-distinct-usernames: 5
    window-seconds: 30
    quarantine-seconds: 600
  reconnect-loop:
    maximum-pre-auth-disconnects: 5
  registration-attempts:
    maximum-accounts-per-address: 3
    capacity: 3
    refill-tokens: 1
    refill-seconds: 60
    state-ttl-seconds: 600
authentication:
  timeout-seconds: 120
  maximum-pre-auth-players: 500
  password:
    minimum-length: 8
    maximum-length: 128
    argon2:
      iterations: 3
      memory-kib: 65536
      parallelism: 1
  lockout:
    attempts: 5
    duration-seconds: 600
storage:
  sqlite-file: authgatewayx.db
  pool-size: 2
executors:
  storage-threads: 2
  storage-queue: 256
  password-threads: 2
  password-queue: 64
  mojang-threads: 4
  mojang-queue: 128
