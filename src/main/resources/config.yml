language: "PL"
premium:
  lookup:
    timeout-millis: 3000
    positive-ttl-seconds: 21600
    negative-ttl-seconds: 300
    maximum-cache-size: 50000
authentication:
  timeout-seconds: 120
  password:
    minimum-length: 8
    maximum-length: 128
    argon2:
      iterations: 3
      memory-kib: 65536
      parallelism: 1
  lockout:
    attempts: 5
    duration-seconds: 600
storage:
  sqlite-file: authgatewayx.db
  pool-size: 2
executors:
  storage-threads: 2
  storage-queue: 256
  password-threads: 2
  password-queue: 64
  mojang-threads: 4
  mojang-queue: 128
